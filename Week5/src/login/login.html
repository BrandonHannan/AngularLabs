<form (ngSubmit)="checkLogin()" #loginForm="ngForm">
  <br>
  <h2>Login</h2>
  <br>
  <div class="form-group">
    <label for="exampleInputUsername1">Username </label>
    <input type="username" class="form-control" [(ngModel)]="username" name="username" id="exampleInputUsername1" aria-describedby="usernameHelp">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Password</label>
    <input type="password" class="form-control" [(ngModel)]="password" name="password" id="exampleInputPassword1">
  </div>
  <br>
  <button type="submit" class="btn btn-primary">Submit</button>
  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
</form>
